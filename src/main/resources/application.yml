spring:
  application:
    name: JavaForum

  # ---- 数据源：PostgreSQL ----
  datasource:
    url: jdbc:postgresql://raspi:5432/javaforum
    username: forum
    password: 4*2j+#bVkNDP7:3EWcF9        # 改成你的本地密码，或用环境变量 DB_PASSWORD 覆盖
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # ---- JPA / Hibernate ----
  jpa:
    hibernate:
      ddl-auto: validate      # 建表交给 Flyway，Hibernate 只做校验
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  # ---- Flyway ----
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # ---- DevTools ----
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

# ---- JWT 配置（第 3 阶段 Security 时读取）----
jwt:
  # 生产环境务必通过环境变量 JWT_SECRET 覆盖；至少 32 字节
  secret: ${JWT_SECRET:change-me-in-production-please-use-a-256bit-random-key}
  # Token 有效期（毫秒）：24 小时
  expiration-ms: 86400000
  # 响应头名称
  header: Authorization
  # Token 前缀
  prefix: "Bearer "

# ---- 日志 ----
logging:
  level:
    org.song.forum: debug
    org.hibernate.SQL: debug
    org.springframework.security: info
