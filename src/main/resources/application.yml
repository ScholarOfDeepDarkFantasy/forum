spring:
  application:
    name: JavaForum

  # ---- 数据源：PostgreSQL ----
  # 密码与 JWT 密钥故意不设默认值：缺失时启动直接失败，
  # 而不是静默用弱默认值跑起来。参考 .env.example 设置环境变量。
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/javaforum}
    username: ${DB_USERNAME:forum}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2

  # ---- 文件上传 ----
  # 头像业务上限 2MB；请求体放宽到 3MB，给 multipart 封装开销留余量
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  # ---- JPA / Hibernate ----
  jpa:
    hibernate:
      ddl-auto: validate      # 建表交给 Flyway，Hibernate 只做校验
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  # ---- Flyway ----
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

# ---- JWT 配置 ----
jwt:
  # 生产环境必须通过环境变量 JWT_SECRET 提供；HS256 要求至少 32 字节
  secret: ${JWT_SECRET}
  # Token 有效期（毫秒）：24 小时
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # 响应头名称
  header: Authorization
  # Token 前缀
  prefix: "Bearer "

# ---- 上传文件存储目录（生产通过 UPLOAD_DIR 指向挂载卷） ----
# 本地开发默认落在工作目录 ./uploads；头像写入其下的 avatars/ 子目录
app:
  upload-dir: ${UPLOAD_DIR:./uploads}

# ---- 公共日志基线：只保留应用自身的业务日志，SQL 明细交给 profile ----
logging:
  level:
    root: info
    org.song.forum: info
    org.springframework.security: info
