# 公网入口（Cloudflare Tunnel）的独立 server 块
#
# 背景：cloudflared 的 ingress 是 `hostname: treenewbee.men` → `http://localhost:80`，
# 它会把原始 Host 头（treenewbee.men）原样带给 nginx。而 /etc/nginx/conf.d/app.conf
# 写的是 `server_name raspi;`，匹配不上，于是请求落到 `sites-enabled/default`
# （`server_name _` default_server，root=/var/www/html），/forum/ 自然 404。
#
# 修法：给公网域名单独一个 server 块，只 include forum 的 snippet。
# 不把 treenewbee.men 加进 app.conf 的 server_name，是为了让公网只暴露 /forum/，
# app.conf 里的 /imageweb/、/manager/、/files/、/api/（mini-mall 网关）等内网应用
# 不会被 tunnel 一并带到公网。
#
# 由 deploy.sh 发布到 /etc/nginx/conf.d/forum-public.conf（每次部署幂等覆盖）。
# 注意 conf.d/*.conf 与 sites-enabled/* 都在 http 块里 include，
# 且本文件排在 sites-enabled/default 之前（include 顺序见 /etc/nginx/nginx.conf）。

server {
    listen 80;
    listen [::]:80;
    server_name treenewbee.men;

    # 公网强制 HTTPS：cloudflared 会把客户端 scheme 放进 X-Forwarded-Proto（实测
    # http/https 均有），而 nginx 与 cloudflared 之间恒为明文 http，所以只能看这个头，
    # 不能看 $scheme（否则会无限跳转）。用 308 而非 301：登录/发帖等 POST 重定向后
    # 方法与请求体保持不变。本机带 `Host: treenewbee.men` 的部署断言没有这个头，
    # 因此不受影响。Cloudflare 面板里的 Always Use HTTPS 是双保险，见部署手册。
    if ($http_x_forwarded_proto = "http") {
        return 308 https://treenewbee.men$request_uri;
    }

    # 相对跳转：cloudflared 用明文 http 连源站，nginx 默认会把 `return 302 /forum/`
    # 补成绝对地址 http://treenewbee.men/forum/ —— 公网用户从 https 进来后会被降级到
    # http。absolute_redirect off 让 Location 保持相对路径，浏览器沿用原 scheme。
    absolute_redirect off;

    # 基础安全响应头（源站兜底）。HSTS 不带 includeSubDomains：该域名下可能还有
    # 其它内网应用子域。nginx 1.22 没有 add_header_inherit：/forum/assets/ 与
    # /forum/index.html 自带 add_header，因此 snippets/forum.conf 在这两个 location
    # 里也各写了一组同样的头（见 docs/DEVELOPMENT.md §4.15）；uploads location 仅带
    # X-Content-Type-Options，是已知的图片侧缺口。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # cloudflared 从本机回环连过来，且只有它能提供 CF-Connecting-IP。
    # 不配 realip 时 $remote_addr 恒为 ::1，后端 ClientIpResolver 会看到
    # 所有人共用一个环回地址 —— 登录限流会把全站当成同一个 IP（实测 5 次失败后
    # 任何人登录都 429）。set_real_ip_from 限定回环，公网直连 80 无法伪造该头。
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    # 前端静态 + SPA 回退 + /forum/api/ 反代 + SSE 精确 location 全在这里
    include /etc/nginx/snippets/forum.conf;

    # 该 server 块没有其它 location：除 /forum/ 之外的路径（/imageweb/、/manager/ 等）
    # 一律落到 nginx 默认 404，不会误暴露内网应用。
}
