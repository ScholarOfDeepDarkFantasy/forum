# JavaForum 前端与 API 反向代理（nginx snippet）
#
# 由 Jenkins 发布到 /etc/nginx/snippets/forum.conf，
# 并被 /etc/nginx/conf.d/app.conf 的 server 块 include（一次性初始化，见 docs/deployment/README.md）。
#
# 访问入口：http://raspi/forum/
# 注意 app.conf 里是 `server_name raspi`，用 IP 访问会落到 sites-enabled/default，
# 所以本地冒烟测试必须带 -H 'Host: raspi'。

location = /forum {
    return 302 /forum/;
}

# 静态资源：vite 产物文件名带 hash，可以长缓存
# 只写 add_header，不写基于时间的过期指令 —— 后者也会生成一条 Cache-Control，
# 两者同写会让响应出现两个 Cache-Control 头（语义非法，中间层合并行为不一致）。
location ^~ /forum/assets/ {
    alias /pd/Program/forum/frontend/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    # 安全响应头（第十轮）：location 里一旦有 add_header 就不再继承 server 级
    # add_header（nginx 1.22 无 add_header_inherit），所以公网 HTML/静态头的下发点
    # 在这里和下面的 index.html，而不是 forum-public.conf 的 server 块。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log off;
}

# 头像：容器外的宿主机目录，直接由 nginx 直出，不经过后端
# 文件名是服务端生成的 UUID，内容不会变，可以长缓存
location ^~ /forum/uploads/ {
    alias /pd/Program/forum/uploads/;
    expires 7d;
    access_log off;
    # 第十一轮：补齐全套安全头。该 location 自带 add_header，不继承 server 级
    # （nginx 1.22 无 add_header_inherit）；全部带 always，404 也下发，
    # deploy.sh 用不存在的文件名做部署断言。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

# SPA：history 路由，未命中的路径回退到 index.html
location /forum/ {
    alias /pd/Program/forum/frontend/;
    index index.html;
    try_files $uri $uri/ /forum/index.html;
}

# 入口页：必须每次回源校验。`index index.html` 与 `try_files … /forum/index.html`
# 都是「内部重定向到 /forum/index.html」，因此下面这个精确匹配同时覆盖
# /forum/ 与 /forum/xxx 两条路径，不需要在两个地方各写一次。
# 不把 no-cache 写进 location /forum/：那会让 favicon 等其它直出文件也带上它。
location = /forum/index.html {
    alias /pd/Program/forum/frontend/index.html;
    add_header Cache-Control "no-cache";
    # 安全响应头（第十轮）：HTML 的响应由这个精确 location 产出，它自带的
    # add_header 会屏蔽 server 级 add_header（见上方 assets 块的说明）。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # 第十一轮：强制 CSP。script-src 用 SHA-256 精确放行首页唯一的内联主题引导脚本，
    # 不放开 'unsafe-inline'；改 index.html 内联脚本后必须同步这里的哈希，
    # frontend/src/plugins/csp.spec.js 会断言两者一致。
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'sha256-Sbv+SnhhPDOg1J2CVOMR4HoLBVSxnmSJ54wG/DCJq94='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'self'" always;
}

# SSE 通知订阅：必须精确匹配并单独配置
# - 通用 /forum/api/ 的 proxy_read_timeout 是 60s，SSE 连接会被每分钟掐断
# - 默认 proxy_buffering on 会把事件攒在 nginx 里，前端要等到心跳/缓冲满才收到
# - ticket 在查询串上，$is_args$args 必须原样透传
location = /forum/api/notifications/stream {
    proxy_pass http://127.0.0.1:8086/api/notifications/stream$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 清空 Connection，保持长连接（SSE 不参与 keep-alive 复用）
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    # 后端单条连接最长 30 分钟（app.sse.timeout-ms），留双倍余量；
    # 到点由服务端 complete，客户端自动换票重连
    proxy_read_timeout 3600s;
    gzip off;
}

# API 反向代理到后端容器（后端只绑 127.0.0.1:8086）
location /forum/api/ {
    proxy_pass http://127.0.0.1:8086/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    # 头像上传是 multipart，nginx 默认 1m 会先于 Spring 的 2MB 限制返回 413；
    # 放宽到 3m（= Spring max-request-size），真正的大小校验仍由后端负责
    client_max_body_size 3m;
}
