# JavaForum 部署用 compose（podman-compose 1.0.3 兼容）
#
# 部署形态：
#   - 后端跑在 podman 容器里（rootless，以 pi 身份运行）
#   - 数据库复用主机上已有的 rootless postgresql 容器（库 javaforum，数据保留），
#     容器内经 host.containers.internal:5432 访问宿主机；不再在 compose 里起 db
#   - 前端不在容器里：由 nginx 直接托管 /pd/Program/forum/frontend（见 deploy/nginx/forum.conf）
#
# 本地开发不用本文件：本地是 `mvn spring-boot:run` + 本机 PostgreSQL（见 README）。
#
# 用法（部署机）：
#   cp .env.example .env      # 按 docs/deployment/README.md 填 DB_URL / DB_PASSWORD / JWT_SECRET
#   podman-compose -p forum up -d
#
# 注意 1.0.3 的限制：不支持顶层 name:、depends_on.condition、profiles；
# 镜像自带 HEALTHCHECK（需 --format docker 构建才会保留），
# 部署脚本用 curl 轮询 /api/health 判断就绪，不依赖 compose 的 healthcheck。

services:
  backend:
    image: localhost/forum-backend:${IMAGE_TAG:-latest}
    container_name: forum-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: "8080"
      LOG_FILE: /app/logs/javaforum.log
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError}
    ports:
      # 只绑本机回环：由 nginx 反代，局域网不直接暴露后端
      - "127.0.0.1:${HOST_PORT:-8086}:8080"
    restart: unless-stopped
    # 小内存主机（3.7G）上必须限制，避免 JVM 吃满
    mem_limit: 768m
